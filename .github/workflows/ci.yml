# The gates after the unit tests are the point of this file.
#
# A directory restructure breaks build CONFIGURATION, not application logic, so
# Karma stays green while Tailwind purges every class, a catalogue re-enters the
# initial bundle, or _redirects stops being copied and every deep link 404s.
# None of that is unit-testable and all of it ships silently.
#
# That is not hypothetical here. Moving the app into apps/habiti left Tailwind's
# content glob pointing at the old ./src: the stylesheet went from 70 kB to
# 4.6 kB, the build passed, all 640 tests passed, and every page would have
# rendered unstyled. verify:assets now has a stylesheet floor because of it —
# the size budget could not catch it, since the bundle got SMALLER.
#
# Still using run-many rather than `nx affected`: with one project they are the
# same thing, and affected needs a base ref (nrwl/nx-set-shas) that is only
# worth wiring up once there are several projects to skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, test, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Both tsconfigs, via a per-project target so this keeps covering every
      # app as more are added. The app build does not compile specs, so a broken
      # spec would otherwise only surface in the test run's noise.
      - name: Typecheck
        run: npm run typecheck

      # ChromeHeadless with no --no-sandbox: the ubuntu runner is not root, so
      # the sandbox works. A container-based runner would need the flag.
      - name: Unit tests
        run: npm run test:ci

      # project.json sets defaultConfiguration to production.
      - name: Production build
        run: npm run build

      - name: Initial bundle budget
        run: npm run verify:bundle

      - name: Publish directory is deployable
        run: npm run verify:assets

  relay:
    name: Relay — typecheck, protocol, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: realtime-server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The relay duplicates the app's protocol block and this is the only thing
      # keeping the two in step. It reads the app file by relative path, and the
      # move to apps/habiti did break it — loudly, with a "cannot read" failure,
      # which is the one behaviour this script must never lose. Extracting the
      # protocol into a shared library deletes both the duplication and this step.
      - name: Protocol contract matches the app
        run: npm run check:protocol

      - name: Tests
        run: npm test
